// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}


  // BEGIN ipod-player media3 dedupe (retriever module)
  project(':missingcore_react-native-metadata-retriever').configurations.configureEach {
    withDependencies {
      constraints {
        add('implementation', "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}")
      }
    }
  }
  // END ipod-player media3 dedupe (retriever module)
allprojects {
  // BEGIN ipod-player media3 dedupe (root) (mirrored by plugins/withMedia3Resolution.js)
  //
  // @missingcore/react-native-metadata-retriever 3.2.1 depends on a repackaged
  // Media3 fork (com.github.MissingCore.media:media3-*:1.9.3-MissingCore.1)
  // that keeps the androidx.media3.* package names, while expo-audio pulls the
  // standard androidx.media3 modules. Both therefore ship the same classes and
  // the APK step fails with duplicate class errors.
  //
  // Every fork module is redirected onto its upstream counterpart, which
  // publishes the same class set (media3-inspector included), so exactly one
  // copy of every androidx.media3 class ends up in the graph. The explicit
  // extractor substitution documents the original failure; eachDependency
  // covers the rest of the fork modules (common, container, decoder,
  // datasource, database, effect, exoplayer, inspector, ...).
  //
  // Keep this block identical to the config plugin, or a prebuild will not
  // reproduce it.
  configurations.all {
    resolutionStrategy {
      dependencySubstitution {
        substitute module('com.github.MissingCore.media:media3-extractor') using module('androidx.media3:media3-extractor:1.9.3')
      }
      eachDependency { details ->
        if (details.requested.group == 'com.github.MissingCore.media') {
          details.useTarget "androidx.media3:${details.requested.name}:1.9.3"
        }
      }
    }
  }
  // END ipod-player media3 dedupe (root)
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
