name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Nothing in this workflow publishes.
permissions:
  contents: read

concurrency:
  # One run per ref; a new push cancels the previous run on that ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Typecheck, pure checks, JS bundles
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Pure-function checks
        run: npm run check:pure

      # `expo export` is a JS-only bundling smoke test: it proves Metro can
      # resolve the whole graph for each platform without running a native build.
      - name: Bundle Android (smoke test)
        run: npx expo export --platform android

      - name: Bundle iOS (smoke test)
        run: npx expo export --platform ios
