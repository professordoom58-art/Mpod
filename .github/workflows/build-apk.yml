name: Android release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arm64-only:
        description: Build arm64-v8a only
        type: boolean
        default: true

# Read-only by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      # The REAL uploaded filename, which differs between the two signing
      # paths (release-signed vs -debugkey). The release job must use this
      # rather than recomputing the name, or the fallback artifact never
      # matches and the release fails on an unmatched file.
      #
      # Both signing steps write `apk_name`; only one of them runs, so the
      # coalesce always resolves to the step that actually produced the file.
      apk_name: ${{ steps.sign_release.outputs.apk_name || steps.sign_ephemeral.outputs.apk_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Pure-function checks
        run: npm run check:pure

      # `--no-install` skips npm install AND CocoaPods (confirmed via
      # `npx expo prebuild --help`). npm ci already ran, and Android needs no pods.
      # VERSION_CODE feeds app.config.ts -> android.versionCode.
      - name: Prebuild Android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install

      - name: Restrict to arm64-v8a
        if: github.event_name == 'workflow_dispatch' && inputs.arm64-only
        run: echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Compute artifact name
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA7=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "apk_base=ipod-player-${VERSION}-${SHA7}" >> "$GITHUB_OUTPUT"
          echo "apk_name=ipod-player-${VERSION}-${SHA7}.apk" >> "$GITHUB_OUTPUT"
          echo "apk_name_debugkey=ipod-player-${VERSION}-${SHA7}-debugkey.apk" >> "$GITHUB_OUTPUT"

      # Secrets cannot be referenced from an `if:` expression, so probe them in
      # the shell and expose only a boolean. Values are never printed.
      - name: Probe signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign APK with release keystore
        id: sign_release
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          # Delete the decoded keystore whatever happens next.
          trap 'rm -f "$KEYSTORE_FILE"' EXIT

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -1 "$SDK/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$SDK/build-tools/$BUILD_TOOLS/apksigner"
          echo "Using apksigner from build-tools $BUILD_TOOLS"

          ALIAS="${KEY_ALIAS:-ipod}"

          # Gradle's release output is `app-release-unsigned.apk` when no
          # signingConfig is applied and `app-release.apk` when one is. Accept
          # either instead of hard-coding one name.
          INPUT=""
          for candidate in \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release.apk; do
            if [ -f "$candidate" ]; then INPUT="$candidate"; break; fi
          done
          if [ -z "$INPUT" ]; then
            echo "::error::No release APK found under android/app/build/outputs/apk/release/"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "Signing $INPUT"

          OUTPUT="$RUNNER_TEMP/${{ steps.meta.outputs.apk_name }}"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$OUTPUT" \
            "$INPUT"

          "$APKSIGNER" verify --print-certs "$OUTPUT"

          echo "APK_PATH=$OUTPUT" >> "$GITHUB_ENV"
          # Publish the ACTUAL filename so the release job attaches the right
          # file on both the release-signed and the fallback path.
          echo "apk_name=$(basename "$OUTPUT")" >> "$GITHUB_OUTPUT"

      # No repository secrets: still produce an APK that INSTALLS. An unsigned
      # release APK is rejected by the installer, so generate a throwaway
      # keystore on the runner and sign with it. The key is ephemeral, so this
      # build cannot upgrade a release-signed install and vice versa.
      - name: Fall back to ephemeral-key signing
        id: sign_ephemeral
        if: steps.signing.outputs.available != 'true'
        run: |
          set -euo pipefail
          echo "::warning title=Ephemeral-key APK::KEYSTORE_BASE64 / KEYSTORE_PASSWORD are not set. Signing with a throwaway keystore generated on this runner. The APK installs, but it cannot upgrade a release-signed install, and each run produces a different signing identity. Do not publish it as a real release."

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -1 "$SDK/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$SDK/build-tools/$BUILD_TOOLS/apksigner"
          echo "Using apksigner from build-tools $BUILD_TOOLS"

          INPUT=""
          for candidate in \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release.apk; do
            if [ -f "$candidate" ]; then INPUT="$candidate"; break; fi
          done
          if [ -z "$INPUT" ]; then
            echo "::error::No release APK found under android/app/build/outputs/apk/release/"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "Signing $INPUT"

          KEYSTORE_FILE="$RUNNER_TEMP/ephemeral.keystore"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT

          # Throwaway password: the key is deleted at the end of the job and is
          # never used again, so it is not a secret worth protecting.
          EPHEMERAL_PASS="ephemeral-$(date +%s)"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype PKCS12 \
            -alias ipod \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$EPHEMERAL_PASS" \
            -keypass "$EPHEMERAL_PASS" \
            -dname "CN=Ephemeral Debug Key, OU=CI, O=ipod-player, L=NA, S=NA, C=US"

          OUTPUT="$RUNNER_TEMP/${{ steps.meta.outputs.apk_base }}-debugkey.apk"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias ipod \
            --ks-pass "pass:$EPHEMERAL_PASS" \
            --key-pass "pass:$EPHEMERAL_PASS" \
            --out "$OUTPUT" \
            "$INPUT"

          "$APKSIGNER" verify --print-certs "$OUTPUT"

          echo "APK_PATH=$OUTPUT" >> "$GITHUB_ENV"
          echo "apk_name=$(basename "$OUTPUT")" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ipod-player-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            android/app/build/outputs/logs/
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The only job that publishes, so the only one with write access.
    permissions:
      contents: write

    steps:
      # Explicit `path` so the published path is deterministic. Without it the
      # artifact lands in the workspace root and a `dist/...` reference would
      # never match.
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ipod-player-apk
          path: dist

      # No actions/checkout in this job, so action-gh-release has no local git
      # context. target_commitish tells it which commit the tag points at and
      # lets it generate release notes.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ needs.build.outputs.apk_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Every push to main publishes a rolling prerelease, so a new commit always
  # has a downloadable APK without a tag or a manual `gh workflow run`. The
  # fixed asset name (and overwrite_files) keeps the release to one file
  # instead of accumulating an asset per commit. Real releases stay tag-gated.
  release-edge:
    name: Publish rolling edge prerelease
    needs: build
    # Manual runs publish edge too, not just pushes to main.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ipod-player-apk
          path: dist

      - name: Normalise asset name
        run: |
          set -euo pipefail
          APK=$(ls dist/*.apk | head -n 1)
          cp "$APK" dist/ipod-player-edge.apk
          rm -f "$APK"
          ls -l dist

      - name: Publish edge prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: Edge build (main)
          # No checkout here either: pin the synthetic/edge tag to this commit.
          target_commitish: ${{ github.sha }}
          prerelease: true
          # `legacy` keeps GitHub's default latest-release handling; the
          # prerelease flag is what keeps edge off the "Latest" slot.
          make_latest: legacy
          overwrite_files: true
          generate_release_notes: true
          files: dist/ipod-player-edge.apk
          fail_on_unmatched_files: true
